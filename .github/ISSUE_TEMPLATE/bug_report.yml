name: Bug report
description: Something in Arc and Dia rebuild pack does not work.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: The commands you ran or the steps you took.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "feature ID and the Arc or Dia version you compared against"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: The full error message or log. Please leave out private files and personal data.
